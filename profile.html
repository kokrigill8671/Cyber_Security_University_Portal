<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Profile | Cyber Security University Portal</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:linear-gradient(rgba(5,35,60,.82),rgba(5,35,60,.82)),
url("https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1920&q=80");

background-size:cover;
background-position:center;
color:white;

}

.header{

height:70px;
background:#0ea5e9;

display:flex;
justify-content:space-between;
align-items:center;

padding:0 30px;

}

.header h2{

font-size:24px;

}

.header a{

color:white;
text-decoration:none;
background:#0284c7;
padding:10px 18px;
border-radius:8px;

}

.container{

display:flex;

}

.sidebar{

width:250px;
height:calc(100vh - 70px);

background:#082f49;

}

.sidebar a{

display:block;
padding:16px 25px;

color:white;

text-decoration:none;

transition:.3s;

}

.sidebar a:hover{

background:#0ea5e9;
padding-left:35px;

}

.content{

flex:1;

padding:40px;

}

.profile-card{

background:rgba(255,255,255,.12);

backdrop-filter:blur(15px);

padding:35px;

border-radius:20px;

box-shadow:0 0 30px rgba(14,165,233,.4);

}

.profile-top{

display:flex;

align-items:center;

margin-bottom:35px;

}

.profile-photo{

width:130px;
height:130px;

border-radius:50%;

background:#0ea5e9;

display:flex;

justify-content:center;

align-items:center;

font-size:60px;

margin-right:30px;

}

.profile-info h1{

margin-bottom:10px;

}

.profile-info p{

color:#ddd;

}

.form{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:20px;

}

.form-group{

display:flex;

flex-direction:column;

}

.form-group label{

margin-bottom:8px;

font-weight:600;

}

.form-group input{

padding:12px;

border:none;

border-radius:8px;

font-size:15px;

}

.form-group input:focus{

outline:none;

box-shadow:0 0 10px #38bdf8;

}

.full{

grid-column:1/3;

}

button{

margin-top:25px;

padding:15px 35px;

background:#0ea5e9;

color:white;

border:none;

border-radius:10px;

font-size:17px;

cursor:pointer;

}

button:hover{

background:#0284c7;

}

.footer{

margin-top:35px;

text-align:center;

color:#ddd;

}

@media(max-width:900px){

.container{

flex-direction:column;

}

.sidebar{

width:100%;
height:auto;

}

.form{

grid-template-columns:1fr;

}

.full{

grid-column:auto;

}

.profile-top{

flex-direction:column;
text-align:center;

}

.profile-photo{

margin-right:0;
margin-bottom:20px;

}

}

</style>

</head>

<body>

<div class="header">

<h2>🛡 Cyber Security University Portal</h2>

<a href="/">Logout</a>

</div>

<div class="container">

<div class="sidebar">

<a href="/dashboard">🏠 Dashboard</a>

<a href="/profile">👤 Profile</a>

<a href="/courses">📚 Courses</a>

<a href="/attendance">📅 Attendance</a>

<a href="/results">🎓 Results</a>

<a href="/notices">📢 Notices</a>

<a href="/contact">📞 Contact</a>

</div>

<div class="content">

<div class="profile-card">

<div class="profile-top">

<div class="profile-photo">

👨‍🎓

</div>

<div class="profile-info">

<h1>Gurpreet Singh</h1>

<p>MCA Cyber Security</p>

<p>Student ID : MCA2026CS001</p>

<p>Email : gurpreet@example.com</p>

</div>

</div>

<form>

<div class="form">

<div class="form-group">

<label>First Name</label>

<input type="text" value="Gurpreet">

</div>

<div class="form-group">

<label>Last Name</label>

<input type="text" value="Singh">

</div>

<div class="form-group">

<label>Email</label>

<input type="email" value="gurpreet@example.com">

</div>

<div class="form-group">

<label>Phone</label>

<input type="text" value="+91 9876543210">

</div>

<div class="form-group full">

<label>Address</label>

<input type="text" value="Punjab, India">

</div>

</div>

<button type="submit">

Update Profile

</button>

</form>

</div>

<div class="footer">

© 2026 Cyber Security University Portal

</div>

</div>

</div>

</body>
</html>

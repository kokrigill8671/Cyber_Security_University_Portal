{% extends "base.html" %}

{% block title %}Student Registration{% endblock %}

{% block content %}

<style>

.register-container{

max-width:900px;
margin:auto;

background:rgba(255,255,255,.12);

backdrop-filter:blur(15px);

padding:40px;

border-radius:20px;

box-shadow:0 0 30px rgba(14,165,233,.4);

}

.register-container h1{

text-align:center;

margin-bottom:30px;

color:#7dd3fc;

}

.form-grid{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:20px;

}

.form-group{

display:flex;

flex-direction:column;

}

.form-group label{

margin-bottom:8px;

font-weight:600;

}

.form-group input,
.form-group select,
.form-group textarea{

padding:14px;

border:none;

border-radius:10px;

font-size:15px;

}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{

outline:none;

box-shadow:0 0 10px #38bdf8;

}

.full{

grid-column:1/3;

}

button{

margin-top:30px;

width:100%;

padding:15px;

background:#0ea5e9;

color:white;

font-size:18px;

border:none;

border-radius:10px;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#0284c7;

transform:translateY(-2px);

}

.login-link{

text-align:center;

margin-top:20px;

}

.login-link a{

color:#7dd3fc;

text-decoration:none;

font-weight:bold;

}

@media(max-width:900px){

.form-grid{

grid-template-columns:1fr;

}

.full{

grid-column:auto;

}

}

</style>

<div class="register-container">

<h1>📝 Student Registration</h1>

<form action="/register" method="POST">

<div class="form-grid">

<div class="form-group">

<label>First Name</label>

<input
type="text"
name="first_name"
required>

</div>

<div class="form-group">

<label>Last Name</label>

<input
type="text"
name="last_name"
required>

</div>

<div class="form-group">

<label>Email</label>

<input
type="email"
name="email"
required>

</div>

<div class="form-group">

<label>Phone Number</label>

<input
type="text"
name="phone"
required>

</div>

<div class="form-group">

<label>Student ID</label>

<input
type="text"
name="student_id"
required>

</div>

<div class="form-group">

<label>Course</label>

<select name="course">

<option>MCA Cyber Security</option>

<option>MCA AI & ML</option>

<option>MCA Data Science</option>

<option>MCA General</option>

</select>

</div>

<div class="form-group">

<label>Semester</label>

<select name="semester">

<option>Semester 1</option>

<option>Semester 2</option>

<option>Semester 3</option>

<option>Semester 4</option>

</select>

</div>

<div class="form-group">

<label>Date of Birth</label>

<input
type="date"
name="dob">

</div>

<div class="form-group full">

<label>Address</label>

<textarea
name="address"
rows="4"></textarea>

</div>

<div class="form-group">

<label>Username</label>

<input
type="text"
name="username"
required>

</div>

<div class="form-group">

<label>Password</label>

<input
type="password"
name="password"
required>

</div>

</div>

<button type="submit">

Register Student

</button>

</form>

<div class="login-link">

Already have an account?

<a href="/login">

Login Here

</a>

</div>

</div>

{% endblock %}

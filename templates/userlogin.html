{% extends "base.html" %}

{% block title %}User Login{% endblock %}

{% block content %}

<style>

.login-container{
    max-width:450px;
    margin:60px auto;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(15px);
    padding:40px;
    border-radius:20px;
    box-shadow:0 0 25px rgba(14,165,233,.4);
}

.login-container h1{
    text-align:center;
    color:#7dd3fc;
    margin-bottom:30px;
}

.form-group{
    display:flex;
    flex-direction:column;
    margin-bottom:20px;
}

.form-group label{
    margin-bottom:8px;
    font-weight:bold;
}

.form-group input{
    padding:14px;
    border:none;
    border-radius:10px;
    font-size:16px;
}

.form-group input:focus{
    outline:none;
    box-shadow:0 0 10px #38bdf8;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#0ea5e9;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#0284c7;
}

.links{
    text-align:center;
    margin-top:20px;
}

.links a{
    color:#7dd3fc;
    text-decoration:none;
    font-weight:bold;
}

.links a:hover{
    text-decoration:underline;
}

@media(max-width:600px){

.login-container{
    margin:20px;
    padding:25px;
}

}

</style>

<div class="login-container">

<h1>👤 Student Login</h1>

<form action="/userlogin" method="POST">

<div class="form-group">

<label>Username</label>

<input
type="text"
name="username"
placeholder="Enter Username"
required>

</div>

<div class="form-group">

<label>Password</label>

<input
type="password"
name="password"
placeholder="Enter Password"
required>

</div>

<button type="submit">

Login

</button>

</form>

<div class="links">

<p>
Don't have an account?
<a href="/register">Register Here</a>
</p>

<p>
<a href="/login">Admin Login</a>
</p>

</div>

</div>

{% endblock %}

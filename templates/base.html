<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{% block title %}Cyber Security University Portal{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:linear-gradient(rgba(5,35,60,.85),rgba(5,35,60,.85)),
url("https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1920&q=80");

background-size:cover;
background-position:center;

color:white;

}

.header{

height:70px;

background:#0ea5e9;

display:flex;

justify-content:space-between;

align-items:center;

padding:0 30px;

box-shadow:0 5px 15px rgba(0,0,0,.3);

position:fixed;

top:0;

left:0;

right:0;

z-index:1000;

}

.logo{

font-size:24px;

font-weight:bold;

}

.logout{

text-decoration:none;

background:#0284c7;

color:white;

padding:10px 18px;

border-radius:8px;

}

.container{

display:flex;

margin-top:70px;

}

.sidebar{

width:250px;

min-height:calc(100vh - 70px);

background:#082f49;

padding-top:20px;

}

.sidebar a{

display:block;

padding:16px 25px;

color:white;

text-decoration:none;

transition:.3s;

}

.sidebar a:hover{

background:#0ea5e9;

padding-left:35px;

}

.main{

flex:1;

padding:35px;

}

.page{

background:rgba(255,255,255,.12);

backdrop-filter:blur(15px);

padding:30px;

border-radius:18px;

box-shadow:0 0 25px rgba(14,165,233,.35);

}

.footer{

text-align:center;

padding:20px;

margin-top:30px;

color:#ddd;

}

@media(max-width:900px){

.container{

flex-direction:column;

}

.sidebar{

width:100%;

min-height:auto;

}

.main{

padding:20px;

}

}

</style>

{% block extra_css %}{% endblock %}

</head>

<body>

<div class="header">

<div class="logo">
🛡 Cyber Security University Portal
</div>

<a href="/" class="logout">
Logout
</a>

</div>

<div class="container">

<div class="sidebar">

<a href="/dashboard">🏠 Dashboard</a>

<a href="/profile">👤 Profile</a>

<a href="/courses">📚 Courses</a>

<a href="/attendance">📅 Attendance</a>

<a href="/results">🎓 Results</a>

<a href="/notices">📢 Notices</a>

<a href="/contact">📞 Contact</a>

</div>

<div class="main">

<div class="page">

{% block content %}
{% endblock %}

</div>

<div class="footer">

© 2026 Cyber Security University Portal

</div>

</div>

</div>

{% block extra_js %}{% endblock %}

</body>
</html>

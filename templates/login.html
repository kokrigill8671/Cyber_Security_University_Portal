{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<style>

.login-container{
    max-width:500px;
    margin:40px auto;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(15px);
    padding:40px;
    border-radius:20px;
    box-shadow:0 0 25px rgba(14,165,233,.4);
}

.login-header{
    text-align:center;
    margin-bottom:30px;
}

.login-header h1{
    color:#7dd3fc;
    font-size:38px;
    margin-bottom:10px;
}

.login-header p{
    color:#ffffff;
    font-size:18px;
}

.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    color:white;
    font-weight:bold;
}

.form-group input,
.form-group select{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    font-size:16px;
}

.form-group input:focus,
.form-group select:focus{
    outline:none;
    box-shadow:0 0 10px #38bdf8;
}

.login-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#0ea5e9;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

.login-btn:hover{
    background:#0284c7;
}

.error{
    text-align:center;
    color:#ff6b6b;
    margin-bottom:20px;
    font-weight:bold;
}

.footer{
    margin-top:25px;
    text-align:center;
}

.footer a{
    color:#7dd3fc;
    text-decoration:none;
    font-weight:bold;
}

.footer a:hover{
    text-decoration:underline;
}

</style>

<div class="login-container">

    <div class="login-header">
        <h1>🔐 Login</h1>
        <p>Cyber Security University Portal</p>
    </div>

    {% if error %}
    <div class="error">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login">

        <div class="form-group">
            <label>Login As</label>
            <select name="role" required>
                <option value="student">Student</option>
                <option value="admin">Admin</option>
            </select>
        </div>

        <div class="form-group">
            <label>Username</label>
            <input
                type="text"
                name="username"
                placeholder="Enter Username"
                required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Enter Password"
                required>
        </div>

        <button type="submit" class="login-btn">
            Login
        </button>

    </form>

    <div class="footer">

        <br>

        <a href="#">Forgot Password?</a>

        <br><br>

        <p>
            New Student?
            <a href="{{ url_for('register') }}">Register Here</a>
        </p>

    </div>

</div>

{% endblock %}
